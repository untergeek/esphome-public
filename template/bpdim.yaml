---
packages:
  chip: !include ../esp8266.yaml
  comm: !include ../common.yaml
  togl: !include ../restart_switch.yaml

substitutions:
  board: esp01_1m
  project_name: untergeek.bpdim
  project_version: 1.2.2
  light_id: dimmer
  icon: "mdi:light-switch"
  min: "10"
  max: "1000"
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud: "9600"

### Change from default values in substitutions

# If any value needs changing, set substitutions in the main configuration file, or use vars during package import

#packages:
#  remote: !include
#    file: template/bpdim.yaml
#    vars:
#      id: # custom id
#      icon: # custom icon
#      min: # custom minimum brightness (floor is 0)
#      max: # custom maximum brightness (ceiling is 1000)
#      rx_pin: # custom GPIO
#      tx_pin: # custom GPIO
#      baud: # custom serial baud rate

uart:
  - id: mcu_uart
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: ${baud}
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 256

tuya:
  id: tuya_mcu
  uart_id: mcu_uart
  

light:
  - platform: "tuya"
    id: ${light_id}
    icon: ${icon}
    name: "${friendly_name}"
    dimmer_datapoint: 2
    switch_datapoint: 1
    min_value: ${min}
    max_value: ${max}

